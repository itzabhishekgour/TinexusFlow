<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="52" fill="#1F1E1D"/>

  <!-- T crossbar (top) -->
  <path d="M55 64 L150 64" stroke="#F0EEE6" stroke-width="14" stroke-linecap="round"/>
  <!-- T stem coming down from crossbar center -->
  <path d="M102 64 L102 108" stroke="#F0EEE6" stroke-width="14" stroke-linecap="round"/>

  <!-- Stem curves and becomes the left stroke of N -->
  <path d="M102 108 C 102 140, 102 150, 102 178" stroke="#F0EEE6" stroke-width="14" stroke-linecap="round"/>

  <!-- N diagonal stroke - flows as the branch, in accent color -->
  <path d="M102 108 C 102 130, 140 150, 178 178" stroke="#D97757" stroke-width="14" stroke-linecap="round"/>

  <!-- N right stroke - completes the N, going back up -->
  <path d="M178 178 L178 108" stroke="#F0EEE6" stroke-width="14" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Branch node marking where T becomes N -->
  <circle cx="102" cy="108" r="11" fill="#D97757"/>
</svg>
