# Server configuration
server.port=${PORT:8080}
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Database Configuration (Neon DB / PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API / LLM Configuration
tinexusflow.gemini.api-key=${GEMINI_API_KEY}
tinexusflow.gemini.model-name=${GEMINI_MODEL:gemini-3.1-flash-lite-preview}
